<div id="email-labels-container" style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px;">
    {% for label in labels %}
    <span style="display: inline-flex; align-items: center; gap: 5px; font-size: 0.8rem; font-weight: 600; padding: 3px 8px; border-radius: 9999px; background-color: {{ label.color }}1a; color: {{ label.color }}; border: 1px solid {{ label.color }}40; max-width: 180px; overflow: hidden;">
        <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ label.name }}</span>
        <button type="button" 
                hx-delete="/api/v1/emails/{{ email_id }}/labels/{{ label.id }}" 
                hx-target="#email-labels-container" 
                hx-swap="outerHTML"
                title="{{ locale.remove_label_from_email() }}"
                style="background: none; border: none; padding: 0; margin: 0; color: {{ label.color }}; cursor: pointer; display: inline-flex; align-items: center; line-height: 1; opacity: 0.75;"
                onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.75'">
            &times;
        </button>
    </span>
    {% endfor %}

    {% if !all_user_labels.is_empty() %}
    <form hx-post="/api/v1/emails/{{ email_id }}/labels" hx-target="#email-labels-container" hx-swap="outerHTML" style="margin: 0; display: inline-flex; gap: 4px; align-items: center;">
        <select name="label_id" required style="font-size: 0.78rem; padding: 2px 6px; border: 1px solid #cbd5e0; border-radius: 4px; background: white; color: #4a5568; max-width: 140px;">
            <option value="" disabled selected>{{ locale.filter_select_label_placeholder() }}</option>
            {% for ulabel in all_user_labels %}
                {% if !labels.contains(ulabel) %}
                <option value="{{ ulabel.id }}">{{ ulabel.name }}</option>
                {% endif %}
            {% endfor %}
        </select>
        <button type="submit" class="btn" style="padding: 2px 8px; font-size: 0.78rem; background-color: #edf2f7; color: #4a5568; border: 1px solid #cbd5e0;">
            {{ locale.add_label_to_email() }}
        </button>
    </form>
    {% endif %}
</div>
